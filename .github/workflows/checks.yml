name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: 'stable'
          cache: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: go test -race ./...
      - run: go vet ./...
      - run: go build -o bin/pressure ./cmd/pressure
      - run: python3 -m unittest discover -s tests -v
      - run: python3 scripts/demo_experiment.py --output-dir /tmp/pressure-demo

